# cargo-deny configuration: dependency licenses must be compatible with AGPL-3.0-only.
# Run: cargo deny check licenses

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "AGPL-3.0-only",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
